version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
    volumes:
      - ./organism.db:/app/organism.db
      - ./products:/app/products
      - ./growth_outbox:/app/growth_outbox

  frontend:
    image: node:20-slim
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    command: npm run dev -- --port 8080 --host
    depends_on:
      - backend
